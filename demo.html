<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hefford Services — Never Miss a Job Again</title>
<meta name="description" content="Watch a missed call turn into a booked job in 4 minutes — automatically, while you're on the tools. 40-second demo.">
<meta property="og:title" content="Every missed call is a customer dialling your competitor.">
<meta property="og:description" content="Watch a missed call turn into a booked job in 4 minutes — automatically. 40-second demo for Hefford Services.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0c0e'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-weight='bold' font-size='20' fill='%23a83232' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   EDIT THE CONFIG BLOCK IN THE <script> AT THE BOTTOM
   to re-brand this demo per prospect (business name, messages,
   accent colour, end-card line). No other edits needed.
   ============================================================ */

:root{
  --ink:#0c0c0e;             /* black */
  --ink-2:#161618;           /* charcoal */
  --paper:#ececec;           /* light grey (matches logo backdrop) */
  --paper-dim:#98989d;       /* mid grey */
  --accent:#a83232;          /* Hefford maroon — overridden by CONFIG */
  --bubble-biz:#31c15e;      /* SMS green (kept for realism inside the phone) */
  --bubble-cust:#e9e9eb;
  --chip:#1b1b1e;
  --ok:#3ecf74;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#050506;
  color:var(--paper);
  font-family:'Archivo',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;min-height:100vh;padding:18px;
}

/* ---------- STAGE (record this panel, 4:5) ---------- */
.stage{
  position:relative;
  width:min(540px, 92vw, calc((100vh - 120px) * 0.8));
  aspect-ratio:4/5;
  border-radius:18px;
  overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% -10%, #2b2224 0%, transparent 55%),
    radial-gradient(90% 70% at 50% 115%, #1a1a1c 0%, transparent 60%),
    linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}
.countdown{
  position:absolute;inset:0;z-index:40;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(64px,20cqw,120px);font-weight:900;color:var(--paper);
  background:rgba(8,11,16,.55);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s;
  font-variant-numeric:tabular-nums;
}
.countdown.show{opacity:1}
.stage-chip{
  position:absolute;left:50%;transform:translateX(-50%) translateY(6px);bottom:3.5%;z-index:45;
  font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(11px,2.6cqw,14px);letter-spacing:.05em;
  color:var(--paper);background:rgba(20,20,23,.78);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14);padding:.7em 1.3em;border-radius:999px;
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s,transform .5s;
}
.stage-chip.show{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.stage-chip:hover{background:rgba(35,35,40,.85)}
.stage::after{ /* vignette */
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 140px rgba(0,0,0,.45);
}

/* ---------- clock chip (signature) ---------- */
.clock{
  position:absolute;top:3.2%;right:4.5%;z-index:30;
  display:flex;align-items:center;gap:.5em;
  font-size:clamp(11px,2.4cqw,14px);font-weight:700;letter-spacing:.08em;
  color:var(--paper-dim);
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);
  padding:.5em .9em;border-radius:999px;
  opacity:0;transform:translateY(-8px);
  transition:opacity .6s ease,transform .6s ease,color .4s;
  font-variant-numeric:tabular-nums;
}
.clock.show{opacity:1;transform:none}
.clock .dot{width:.5em;height:.5em;border-radius:50%;background:var(--accent)}
.clock.done{color:var(--ok)}
.clock.done .dot{background:var(--ok)}

/* ---------- title scenes ---------- */
.scene{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:9%;
  background:linear-gradient(180deg,var(--ink) 0%,var(--ink-2) 100%);
  opacity:0;pointer-events:none;
  transition:opacity .8s ease;
}
.scene.show{opacity:1;pointer-events:auto}
.eyebrow{
  font-size:clamp(10px,2.3cqw,13px);font-weight:700;
  letter-spacing:.32em;text-transform:uppercase;color:var(--accent);
  margin-bottom:1.6em;
  opacity:0;transform:translateY(14px);
  transition:opacity .7s ease .1s,transform .7s ease .1s;
}
.headline{
  font-size:clamp(26px,7.4cqw,44px);font-weight:800;line-height:1.12;
  letter-spacing:-.015em;max-width:11em;
  opacity:0;transform:translateY(16px);
  transition:opacity .8s ease .25s,transform .8s ease .25s;
}
.sub{
  margin-top:1.4em;font-size:clamp(13px,3cqw,17px);font-weight:500;
  color:var(--paper-dim);max-width:24em;line-height:1.5;
  opacity:0;transform:translateY(14px);
  transition:opacity .8s ease .45s,transform .8s ease .45s;
}
.scene.show .eyebrow,.scene.show .headline,.scene.show .sub{opacity:1;transform:none}

/* outro transformation row */
.transform-row{
  display:flex;align-items:center;gap:.6em;flex-wrap:wrap;justify-content:center;
  font-size:clamp(20px,5.4cqw,32px);font-weight:800;letter-spacing:-.01em;
  opacity:0;transform:translateY(16px);
  transition:opacity .8s ease .25s,transform .8s ease .25s;
}
.scene.show .transform-row{opacity:1;transform:none}
.transform-row .missed{color:var(--paper-dim);position:relative}
.transform-row .missed::after{
  content:"";position:absolute;left:0;right:0;top:54%;height:2px;
  background:var(--accent);transform:scaleX(0);transform-origin:left;
  transition:transform .6s ease 1.1s;
}
.scene.show .transform-row .missed::after{transform:scaleX(1)}
.transform-row .arrow{color:var(--accent)}
.transform-row .booked{color:var(--ok)}
.big-stat{
  margin-top:.9em;font-size:clamp(40px,12cqw,72px);font-weight:900;
  letter-spacing:-.03em;line-height:1;color:var(--paper);
  opacity:0;transform:translateY(18px);
  transition:opacity .8s ease .6s,transform .8s ease .6s;
  font-variant-numeric:tabular-nums;
}
.scene.show .big-stat{opacity:1;transform:none}
.big-stat small{display:block;font-size:.28em;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--paper-dim);margin-top:1em}
.brandline{
  margin-top:2.4em;font-size:clamp(12px,2.8cqw,15px);font-weight:600;
  color:var(--accent);letter-spacing:.06em;
  opacity:0;transition:opacity .8s ease .9s;
}
.scene.show .brandline{opacity:1}
.brandline span{color:var(--paper-dim);font-weight:500}

/* ---------- phone ---------- */
.phone-wrap{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.6%;padding:6% 0 5%;
  opacity:0;transform:translateY(26px) scale(.97);
  transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1);
}
.phone-wrap.show{opacity:1;transform:none}
.biz-label{
  font-size:clamp(11px,2.6cqw,14px);font-weight:800;letter-spacing:.26em;
  text-transform:uppercase;color:var(--paper)
}
.brand-plaque{
  width:34%;background:var(--paper);border-radius:10px;
  padding:2.4% 4% 2%;box-shadow:0 8px 24px rgba(0,0,0,.4);
  display:none;align-items:center;justify-content:center;
}
.brand-plaque img{width:100%;display:block}
.brand-plaque.on{display:flex}
.brand-plaque.on + .biz-label,
.has-logo .biz-label{display:none}
.scene .brand-plaque{width:30%;margin-top:2.6em;box-shadow:0 8px 24px rgba(0,0,0,.35);
  opacity:0;transition:opacity .9s ease 1.15s}
.scene.show .brand-plaque.on{opacity:1;display:flex}
.phone{
  width:56%;max-height:76%;aspect-ratio:9/19.5;
  background:linear-gradient(145deg,#43464c 0%,#191a1e 42%,#2a2c31 100%);
  border-radius:23% / 10.6%;
  padding:1.9%;
  box-shadow:0 26px 60px rgba(0,0,0,.62), 0 4px 14px rgba(0,0,0,.4);
  position:relative;
}
.phone::before{ /* titanium rim highlight */
  content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16), inset 0 0 8px rgba(0,0,0,.55);
  pointer-events:none;z-index:3;
}
.phone .sbtn{position:absolute;background:linear-gradient(90deg,#3a3d42,#22242a);border-radius:3px;z-index:0}
.phone .sbtn.action{left:-0.9%;top:17%;width:1.6%;height:3.6%}
.phone .sbtn.vup{left:-0.9%;top:23.5%;width:1.6%;height:6.5%}
.phone .sbtn.vdn{left:-0.9%;top:31.5%;width:1.6%;height:6.5%}
.phone .sbtn.pwr{right:-0.9%;top:25.5%;width:1.6%;height:10%}
.screen{
  width:100%;height:100%;background:#fff;border-radius:20.2% / 9.3%;
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  container-type:inline-size;
}
.island{
  position:absolute;top:1.9%;left:50%;transform:translateX(-50%);
  width:27%;height:3.1%;background:#0a0a0c;border-radius:999px;z-index:5;
}
.statusbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:3.8% 9% 0;font-size:3.9cqw;font-weight:600;color:#000;
}
.statusbar .icons{display:flex;gap:.5em;align-items:center;color:#000}
.statusbar .icons svg{height:.86em;width:auto;display:block}
.msg-header{
  display:flex;flex-direction:column;align-items:center;gap:1.2%;
  padding:2.5% 4% 3%;border-bottom:1px solid #e8e8ea;background:#fbfbfd;
}
.avatar{
  width:13%;aspect-ratio:1;border-radius:50%;
  background:var(--bubble-biz);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:4.6cqw;font-weight:700;overflow:hidden;
}
.avatar.img{background:#fff;border:1px solid #e4e4e8}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.msg-header .name{font-size:4.4cqw;font-weight:600;color:#000}
.thread{
  flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  gap:2.2%;padding:3% 4%;overflow:hidden;background:#fff;
}
.sysnote{
  align-self:center;font-size:3.4cqw;color:#e0483e;font-weight:500;
  background:#fdeeed;padding:1.2% 3.5%;border-radius:999px;
  opacity:0;transform:translateY(10px) scale(.95);
}
.sysnote.grey{color:#8a8a8e;background:#f2f2f4}
.bubble{
  max-width:78%;padding:2.8% 4%;border-radius:5.5cqw;
  font-size:4.1cqw;line-height:1.32;
  opacity:0;transform:translateY(12px) scale(.92);
  position:relative;
}
.bubble.biz{align-self:flex-end;background:var(--bubble-biz);color:#fff;border-bottom-right-radius:1.4cqw}
.bubble.cust{align-self:flex-start;background:var(--bubble-cust);color:#000;border-bottom-left-radius:1.4cqw}
.meta{
  align-self:flex-end;font-size:3.1cqw;color:#8a8a8e;margin-top:-1%;
  opacity:0;transform:translateY(6px);
}
.meta.left{align-self:flex-start}
.pop-in{animation:pop .42s cubic-bezier(.25,1.2,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.typing{
  align-self:flex-start;background:var(--bubble-cust);
  padding:2.8% 4.5%;border-radius:5.5cqw;border-bottom-left-radius:1.4cqw;
  display:flex;gap:1.4cqw;
  opacity:0;transform:translateY(12px) scale(.92);
}
.typing.biz{align-self:flex-end;background:var(--bubble-biz);border-radius:5.5cqw;border-bottom-right-radius:1.4cqw}
.typing i{width:2cqw;height:2cqw;border-radius:50%;background:#9a9aa0;animation:bounce 1.1s infinite}
.typing.biz i{background:rgba(255,255,255,.85)}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-1.6cqw);opacity:1}}
.inputbar{
  display:flex;align-items:center;gap:2.5%;padding:2.5% 4% 4.5%;
}
.inputbar .field{
  flex:1;border:1px solid #d9d9de;border-radius:999px;
  padding:2.2% 4%;font-size:3.9cqw;color:#b0b0b6;
}
.inputbar .send{
  width:8.5%;aspect-ratio:1;border-radius:50%;background:var(--bubble-biz);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:4cqw;
}

/* caption chip under phone */
.caption{
  min-height:2.6em;display:flex;align-items:center;gap:.6em;
  font-size:clamp(12px,2.9cqw,16px);font-weight:600;color:var(--paper);
  background:var(--chip);border:1px solid rgba(255,255,255,.08);
  padding:.65em 1.2em;border-radius:999px;
  opacity:0;transform:translateY(10px);
  transition:opacity .5s ease,transform .5s ease;
}
.caption.show{opacity:1;transform:none}
.caption .dot{width:.55em;height:.55em;border-radius:50%;background:var(--ok);flex:none;
  box-shadow:0 0 0 0 rgba(62,207,116,.5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 .6em rgba(62,207,116,0)}100%{box-shadow:0 0 0 0 rgba(62,207,116,0)}}

/* ---------- controls (outside recording area) ---------- */
.controls{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  transition:opacity .3s;
}
.controls button{
  font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;
  background:#1c1c1f;color:var(--paper);border:1px solid rgba(255,255,255,.12);
  padding:10px 20px;border-radius:999px;cursor:pointer;transition:background .2s;
}
.controls button:hover{background:#2a2a2e}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls .hint{font-size:11.5px;color:#6e6e74;font-weight:500;letter-spacing:.03em}
body.presenting .controls{opacity:0;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="countdown" id="countdown"></div>
  <button class="stage-chip" id="soundChip">🔊 Tap anywhere for sound</button>
  <button class="stage-chip" id="replayChip">↻ Watch again</button>
  <div class="clock" id="clock"><span class="dot"></span><span id="clockText">9:14 AM</span></div>

  <!-- Scene 1: hook -->
  <div class="scene show" id="sceneHook">
    <div class="eyebrow" id="hookEyebrow"></div>
    <div class="headline" id="hookHeadline"></div>
    <div class="sub" id="hookSub"></div>
  </div>

  <!-- Scene 2: phone -->
  <div class="phone-wrap" id="phoneWrap">
    <div class="brand-plaque" id="brandPlaque"><img id="brandPlaqueImg" alt="Business logo"></div>
    <div class="biz-label" id="bizLabel"></div>
    <div class="phone">
      <div class="sbtn action"></div><div class="sbtn vup"></div><div class="sbtn vdn"></div><div class="sbtn pwr"></div>
      <div class="screen">
        <div class="island"></div>
        <div class="statusbar"><span id="sbTime">9:14</span><span class="icons"><svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7.5" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6.5" rx="1"/><rect x="10" y="2.5" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="11.5" rx="1"/></svg><svg viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.6 4.6a9.4 9.4 0 0 1 12.8 0"/><path d="M4.2 7.2a5.6 5.6 0 0 1 7.6 0"/><circle cx="8" cy="10" r="1.35" fill="currentColor" stroke="none"/></svg><svg viewBox="0 0 25 12" fill="none"><rect x="0.6" y="0.6" width="21" height="10.8" rx="3.2" stroke="currentColor" stroke-opacity=".38" stroke-width="1.1"/><rect x="2.4" y="2.4" width="15.5" height="7.2" rx="1.7" fill="currentColor"/><path d="M23.2 3.9v4.2a2.3 2.3 0 0 0 0-4.2Z" fill="currentColor" fill-opacity=".38"/></svg></span></div>
        <div class="msg-header">
          <div class="avatar" id="avatar"></div>
          <div class="name" id="bizName"></div>
        </div>
        <div class="thread" id="thread"></div>
        <div class="inputbar"><div class="field">Text Message</div><div class="send">➤</div></div>
      </div>
    </div>
    <div class="caption" id="caption"><span class="dot"></span><span id="captionText"></span></div>
  </div>

  <!-- Scene 3: outro -->
  <div class="scene" id="sceneOutro">
    <div class="eyebrow" id="outroEyebrow"></div>
    <div class="transform-row">
      <span class="missed">Missed call</span>
      <span class="arrow">→</span>
      <span class="booked">Booked job</span>
    </div>
    <div class="big-stat" id="bigStat">4 min<small id="bigStatLabel"></small></div>
    <div class="brandline" id="brandline"></div>
    <div class="brand-plaque" id="outroPlaque"><img id="outroPlaqueImg" alt="Business logo"></div>
  </div>
</div>

<div class="controls">
  <button id="playBtn">↻ Replay</button>
  <button id="soundBtn">🔊 Sound: on</button>
</div>

/* ---------- audio ---------- */
let audioOn = true, ctx = null;
function ac(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); return ctx; }
function tone(freq, t0, dur, type="sine", gain=0.12){
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime + t0);
  g.gain.linearRampToValueAtTime(gain, c.currentTime + t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
}

  missed : ()=>{ tone(660,0,.28,"sine",.10); tone(494,.18,.34,"sine",.10); },

  pop2   : ()=>{ tone(400,0,.12,"sine",.12); tone(600,.02,.10,"sine",.05); },
  booked : ()=>{ tone(523,0,.16,"sine",.11); tone(659,.11,.16,"sine",.11); tone(784,.22,.3,"sine",.12); },
  whoosh : ()=>{ tone(300,0,.25,"triangle",.05); tone(180,.05,.3,"triangle",.05); }
};
function play(name){ if(audioOn && SOUNDS[name]) try{ SOUNDS[name](); }catch(e){} }

/* ---------- timeline engine ---------- */
let run = 0, loopOn = false, hosted = false;
const params = new URLSearchParams(location.search);
const sleep = (ms, token) => new Promise(res => setTimeout(()=>{ if(token===run) res(); }, ms / (CONFIG.pace || 1)));

function clearThread(){ $("thread").innerHTML = ""; }
function setCaption(text){
  const cap = $("caption");
  if(!text){ cap.classList.remove("show"); return; }
  cap.classList.remove("show");
  setTimeout(()=>{ $("captionText").textContent = text; cap.classList.add("show"); }, 250);
}
function setClock(t){
  if(!t) return;
  $("clockText").textContent = t;
  $("sbTime").textContent = t.replace(/\s?[AP]M/,"");
}
function addBubble(step){
  const th = $("thread");
  let el;
  if(step.side === "sys"){
    el = document.createElement("div");
    el.className = "sysnote pop-in " + (step.cls||"");
    el.textContent = step.text;
  } else {
    el = document.createElement("div");
    el.className = "bubble pop-in " + step.side;
    el.textContent = step.text;
  }
  th.appendChild(el);
  if(step.meta){
    const m = document.createElement("div");
    m.className = "meta pop-in" + (step.side==="cust" ? " left":"");
    m.style.animationDelay = ".25s";
    m.textContent = step.meta;
    th.appendChild(m);
  }
  return el;
}
function addTyping(side){
  const el = document.createElement("div");
  el.className = "typing pop-in" + (side==="biz" ? " biz" : "");
  el.innerHTML = "<i></i><i></i><i></i>";
  $("thread").appendChild(el);
  return el;
}

async function playDemo(){
  const token = ++run;
  if(audioOn) ac().resume && ac().resume();

  // reset
  $("sceneHook").classList.add("show");
  $("sceneOutro").classList.remove("show");
  $("phoneWrap").classList.remove("show");
  $("clock").classList.remove("show","done");
  setCaption("");
  clearThread();
  setClock("9:14 AM");
  $("playBtn").textContent = "↻ Replay";
  $("replayChip").classList.remove("show");

  // Scene 1 — hook
  await sleep(4200, token); if(token!==run) return;

  // Scene 2 — phone
  $("sceneHook").classList.remove("show");
  play("whoosh");
  await sleep(500, token); if(token!==run) return;
  $("phoneWrap").classList.add("show");
  $("clock").classList.add("show");
  await sleep(900, token); if(token!==run) return;

  for(const step of CONFIG.script){
    if(token!==run) return;
    if(step.side.startsWith("typing")){
      const t = addTyping(step.side.endsWith("biz") ? "biz" : "cust");
      await sleep(step.pause, token); if(token!==run) return;
      t.remove();
      continue;
    }
    addBubble(step);
    if(step.sound) play(step.sound);
    if(step.caption) setCaption(step.caption);
    if(step.clock) setClock(step.clock);
    await sleep(step.pause, token); if(token!==run) return;
  }

  // Scene 3 — outro
  $("clock").classList.add("done");
  setCaption("");
  await sleep(700, token); if(token!==run) return;
  $("phoneWrap").classList.remove("show");
  $("clock").classList.remove("show");
  await sleep(600, token); if(token!==run) return;
  $("sceneOutro").classList.add("show");
  play("booked");

  // end-of-demo: loop, or offer replay when viewed via a hosted link
  if(loopOn){
    await sleep(4500, token); if(token!==run) return;
    playDemo();
  } else if(hosted){
    await sleep(1800, token); if(token!==run) return;
    $("replayChip").classList.add("show");
  }
}

/* ---------- controls ---------- */
$("playBtn").addEventListener("click", playDemo);
$("soundBtn").addEventListener("click", ()=>{
  audioOn = !audioOn;
  $("soundBtn").textContent = audioOn ? "🔊 Sound: on" : "🔇 Sound: off";
});
function togglePresent(){ document.body.classList.toggle("presenting"); }
$("soundChip").addEventListener("click", ()=>{
  audioOn = true;
  $("soundBtn").textContent = "🔊 Sound: on";
  ac().resume && ac().resume();
  $("soundChip").classList.remove("show");
});
$("replayChip").addEventListener("click", ()=>{
  $("replayChip").classList.remove("show");
  playDemo();
});
document.addEventListener("keydown", e=>{
  if(e.key==="f"||e.key==="F") togglePresent();
  if(e.key==="r"||e.key==="R") playDemo();
});

/* ---------- autoplay ----------
   Auto-starts everywhere, ~1s after load. On hosted links (http/https) the
   controls are hidden for a clean prospect view; opened locally the controls
   stay visible. Disable with ?autoplay=0. Add ?loop=1 to loop. */
(function boot(){
  const embed = params.get("embed") === "1";
  if(params.get("loop") === "1") loopOn = true;
  const isHttp = location.protocol === "http:" || location.protocol === "https:";
  if(params.get("autoplay") === "0") return;         // opt out with ?autoplay=0
  if(isHttp && !embed){
    hosted = true;
    document.body.classList.add("presenting");       // clean view for the prospect
  }
  if(embed){ hosted = true; }                        // embedded: play ONCE, keep controls, show replay chip at end
  // Sound is ON by default. Browsers still mute audio until the first
  // click/tap/keypress, so unlock the audio context on first interaction
  // and show a brief nudge so viewers know sound is there.
  const unlock = ()=>{ try{ ac().resume && ac().resume(); }catch(e){}
    $("soundChip").classList.remove("show"); };
  ["pointerdown","keydown","touchstart"].forEach(ev =>
    document.addEventListener(ev, unlock, { once:true, capture:true }));
  $("soundChip").classList.add("show");
  setTimeout(()=>{ $("soundChip").classList.remove("show"); }, 7000);
  setTimeout(playDemo, 900);
})();
</script>
